# Our patched CS8409 codec driver (Containerfile, kmod-builder) over the
# in-tree one. Without this, extra/ and kernel/ rank equally and depmod keeps
# whichever copy it reads first, which depends on the filesystem's directory
# order: on the CI builders that was the in-tree one, so iMac19,2 sound
# silently used Fedora's driver.
override snd-hda-codec-cs8409 * extra
