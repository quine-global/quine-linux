name: Stateful Edition

# Checks that Quine Linux Stateful Edition (docs/STATEFUL_EDITION.md) still
# builds: stateful/build.sh, as anyone building it at home runs it (task
# stateful). Nothing is published: the Stateful Edition has no downloads,
# people build their own. x86_64 only: the arm64 runner's disks are too
# small for it (docs/STATEFUL_EDITION.md, "Disk space").
#
# On pushes to main or stateful-edition that touch what it's built from, and
# by hand (with an option for the disk image too).
on:
  push:
    branches: [main, stateful-edition]
    paths:
      - 'stateful/**'
      - 'overlay/**'
      - 'menu/**'
      - 'admin-auth/**'
      - '.forgejo/workflows/stateful.yml'
  workflow_dispatch:
    inputs:
      disk:
        description: 'Also build the disk image'
        type: boolean
        default: false

concurrency:
  group: stateful-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: runner-x86-linux
    timeout-minutes: 180
    steps:
      - uses: https://forge.in.quineglobal.com/quine-global/mirror-actions-checkout@v4

      - name: Free space
        # As iso.yml: one job per runner, so leftovers aren't anyone's.
        run: |
          podman image prune -af >/dev/null || true
          rm -rf /var/tmp/quine-stateful /var/tmp/container_images_storage*
          df -h /var/tmp / | tail -2

      - name: Build
        run: stateful/build.sh ${{ inputs.disk && '--disk' || '' }}

      - name: Clean up
        if: always()
        run: |
          rm -rf output/stateful /var/tmp/quine-stateful
          podman image prune -af >/dev/null || true
